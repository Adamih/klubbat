[project]
name = "political-intelligence"
version = "0.1.0"
description = "Political intelligence platform for Swedish municipal and regional meeting documents (MVP: Uppsala kommunfullmäktige)"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0,<7",
    "httpx>=0.28",
    "selectolax>=0.3.21",
    "xberg>=1.3.0",
    "mistune>=3.3.4",
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
